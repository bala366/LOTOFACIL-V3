plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.autofacil.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.autofacil.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}
